[package]
name = "cnr_experiments_viewer"
version = "0.0.1"
authors = [ "Claudio Cicconetti <c.cicconetti@iit.cnr.it>" ]
edition = "2024"
rust-version = "1.89"
description = "Simple viewer of images via REST"
homepage = "https://edgeless-project.eu/"
license = "MIT"
repository = "https://github.com/edgeless-project/edgeless/"
readme = "README.md"

[lib]
name = "cnr_experiments_viewer"
path = "src/lib.rs"

[[bin]]
name = "viewer"
path = "src/bin/viewer.rs"

[dependencies]
actix-web = "4"
actix-multipart = "0.6"
async-stream = "0.3.6"
bytes = "1"
futures-util = "0.3"
image = "0.25"
once_cell = "1"
tokio = { version = "1", features = ["full"] }
