[workspace]

[profile.dev]
panic = "abort"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
codegen-units = 1
strip = true

[package]
name = "obj_track"
version = "0.1.0"
authors = ["Claudio Cicconetti <c.cicconetti@iit.cnr.it>"]
edition = "2024"

[lib]
name = "obj_track"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
edgeless_function = { path = "../../../edgeless/edgeless_function" }
log = "0.4"
anyhow = "1.0"
serde = {version="1", features=["derive"] }
serde_json = "1"
base64 = "0.22.1"
image = { version = "0.25.8", default-features = false, features = ["jpeg","png"] }